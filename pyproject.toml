[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-legalia-huella"
version = "0.3.0"
description = "Huellas digitales y ZIP de legalización de libros mercantiles (estilo Legalia2), multiplataforma"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "open-legalia-huella contributors" }]
keywords = [
  "legalia",
  "registro-mercantil",
  "legalizacion",
  "huella",
  "sha256",
  "spain",
  "accounting-books",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
open-legalia-huella = "open_legalia_huella.cli:main"

[project.urls]
Homepage = "https://github.com/shakisha/open-legalia-huella"
Issues = "https://github.com/shakisha/open-legalia-huella/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
